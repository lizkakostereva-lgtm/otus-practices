# Base manifests for the URL fraud API.
#
#   kubectl apply -k k8s/
#   kubectl -n url-fraud set image deployment/url-fraud-api api=ghcr.io/<user>/url-fraud-api:<tag>
#
# 40-ingress.yaml is intentionally NOT listed: it needs a domain and a Load
# Balancer. Apply it separately if you go down that route.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-fraud

resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-deployment.yaml
  - 30-service-nodeport.yaml
  - 50-hpa.yaml
  - 60-pdb.yaml

# Replace this with your own image; scripts/deploy_k8s.sh patches it in place.
images:
  - name: ghcr.io/YOUR_GITHUB_USERNAME/url-fraud-api
    newName: ghcr.io/YOUR_GITHUB_USERNAME/url-fraud-api
    newTag: "1.0.0"

commonLabels:
  app.kubernetes.io/part-of: url-fraud