---
# Diploma project CI/CD: lint -> test -> build -> push (Yandex Container
# Registry, GHCR fallback) -> optional deploy to k3s.
#
# The primary registry is cr.yandex. To use it, add in
# Settings -> Secrets and variables -> Actions:
#   Secret  YC_SA_KEY        authorized key JSON (`terraform -chdir=terraform-quota output -raw sa_key_json`)
#   Var     YC_REGISTRY_ID   the registry id (`terraform -chdir=terraform-quota output -raw registry_id`)
# Without these secrets the pipeline stays green and falls back to GHCR.
name: MLOps Telecom Churn CI/CD

on:
  push:
    branches: ["**"]
    paths:
      - "mlops-telecom-churn/**"
      - ".github/workflows/mlops-telecom-churn-ci-cd.yml"
  pull_request:
    paths:
      - "mlops-telecom-churn/**"
      - ".github/workflows/mlops-telecom-churn-ci-cd.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the image to the registry"
        type: boolean
        default: true
      deploy:
        description: "Deploy to k3s (requires KUBECONFIG_B64)"
        type: boolean
        default: false

concurrency:
  group: mlops-churn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository_owner }}/mlops-telecom-churn-api
  K8S_NAMESPACE: mlops-churn

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-telecom-churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pinned: ruff releases extend the default rule set, which would
      # otherwise break linting on old code without config changes.
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: ruff check
        run: ruff check app src tests scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-telecom-churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: mlops-telecom-churn/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: pytest
        run: pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: mlops-telecom-churn
          file: mlops-telecom-churn/docker/api/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push image (cr.yandex)
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Check YC CR credentials
        id: yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          if [ -n "${YC_SA_KEY:-}" ] && [ -n "${YC_REGISTRY_ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "YC_SA_KEY / YC_REGISTRY_ID are not configured: falling back to GHCR"
          fi

      # Primary registry: Yandex Container Registry.
      - name: Log in to cr.yandex
        if: steps.yc.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - name: Build and push to Yandex Container Registry
        if: steps.yc.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: mlops-telecom-churn
          file: mlops-telecom-churn/docker/api/Dockerfile
          push: true
          provenance: false # cr.yandex rejects attestation manifest indexes
          tags: |
            cr.yandex/${{ vars.YC_REGISTRY_ID }}/mlops-telecom-churn-api:${{ github.sha }}
            cr.yandex/${{ vars.YC_REGISTRY_ID }}/mlops-telecom-churn-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fallback when YC secrets are not yet configured: GHCR via GITHUB_TOKEN.
      - name: Log in to GHCR
        if: steps.yc.outputs.available != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR (fallback)
        if: steps.yc.outputs.available != 'true'
        uses: docker/build-push-action@v6
        with:
          context: mlops-telecom-churn
          file: mlops-telecom-churn/docker/api/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.10

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_B64 secret is not set"; exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        env:
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${YC_REGISTRY_ID:-}" ]; then
            IMAGE_REF="cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:${GITHUB_SHA}"
          else
            IMAGE_REF="${IMAGE}:${GITHUB_SHA}"
          fi
          echo "Deploying ${IMAGE_REF}"
          kubectl -n "${K8S_NAMESPACE}" set image deployment/churn-api "api=${IMAGE_REF}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/churn-api --timeout=180s

      - name: Smoke test
        run: |
          set -euo pipefail
          NODE_IP="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')"
          curl -fsS "http://${NODE_IP}:30080/health"
