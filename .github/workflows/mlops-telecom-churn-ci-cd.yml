---
# Diploma project CI/CD: lint -> test -> build -> push (GHCR, optionally YC CR)
# -> optional deploy to k3s.
#
# Works out of the box on any branch: the image is published to GitHub Container
# Registry with the built-in GITHUB_TOKEN (no secrets needed).
#
# Optional (Settings -> Secrets and variables -> Actions):
#   Secret  YC_SA_KEY        authorized key JSON of the CI service account
#   Var     YC_REGISTRY_ID   cr.yandex/<id>, enables the YC Container Registry push
#   Secret  KUBECONFIG_B64   base64 of the k3s kubeconfig, enables the deploy job
name: MLOps Telecom Churn CI/CD

on:
  push:
    branches: ["**"]
    paths:
      - "mlops-telecom-churn/**"
      - ".github/workflows/mlops-telecom-churn-ci-cd.yml"
  pull_request:
    paths:
      - "mlops-telecom-churn/**"
      - ".github/workflows/mlops-telecom-churn-ci-cd.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the image to the registry"
        type: boolean
        default: true
      deploy:
        description: "Deploy to k3s (requires KUBECONFIG_B64)"
        type: boolean
        default: false

concurrency:
  group: mlops-churn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE: ghcr.io/${{ github.repository_owner }}/mlops-telecom-churn-api
  K8S_NAMESPACE: mlops-churn

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-telecom-churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check app src tests scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-telecom-churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: mlops-telecom-churn/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: pytest
        run: pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: mlops-telecom-churn
          file: mlops-telecom-churn/docker/api/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push image
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      (github.event_name == 'push' && (github.ref != 'refs/heads/main' || true)) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: mlops-telecom-churn
          file: mlops-telecom-churn/docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Yandex Container Registry (optional)
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${YC_SA_KEY:-}" ] || [ -z "${YC_REGISTRY_ID:-}" ]; then
            echo "YC_SA_KEY / YC_REGISTRY_ID are not configured, skipping YC CR push"
            exit 0
          fi
          echo "$YC_SA_KEY" | docker login cr.yandex -u json_key --password-stdin
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" "cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:latest"
          docker push "cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:${GITHUB_SHA}"
          docker push "cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:latest"

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.10

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_B64 secret is not set"; exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        env:
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${YC_REGISTRY_ID:-}" ]; then
            IMAGE_REF="cr.yandex/${YC_REGISTRY_ID}/mlops-telecom-churn-api:${GITHUB_SHA}"
          else
            IMAGE_REF="${IMAGE}:${GITHUB_SHA}"
          fi
          echo "Deploying ${IMAGE_REF}"
          kubectl -n "${K8S_NAMESPACE}" set image deployment/churn-api "api=${IMAGE_REF}"
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/churn-api --timeout=180s

      - name: Smoke test
        run: |
          set -euo pipefail
          NODE_IP="$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')"
          curl -fsS "http://${NODE_IP}:30080/health"
