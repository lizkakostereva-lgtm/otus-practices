# Attack simulation parameters. Tune the ramp here without rebuilding images:
# the producer increases the event rate from START_TPS to MAX_TPS over
# RAMP_SECONDS and the consumer replays them at the model API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: attack-config
  namespace: url-fraud
  labels:
    app.kubernetes.io/part-of: url-fraud
data:
  KAFKA_BOOTSTRAP: "kafka:9092"
  KAFKA_TOPIC: "urls"
  START_TPS: "20"
  MAX_TPS: "400"
  RAMP_SECONDS: "300"
  DURATION: "900"
  API_URL: "http://url-fraud-api/api/v1"
  BATCH_SIZE: "16"
  CONCURRENCY: "32"
---
# One pod, two long-running containers (producer + consumer) and an init
# container that blocks until the broker accepts connections. The Job is
# "finished" when both containers exit (after DURATION seconds).
apiVersion: batch/v1
kind: Job
metadata:
  name: url-fraud-attack
  namespace: url-fraud
  labels:
    app.kubernetes.io/name: url-fraud-attack
    app.kubernetes.io/part-of: url-fraud
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-fraud-attack
        app.kubernetes.io/part-of: url-fraud
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do echo "waiting for kafka"; sleep 3; done
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: producer
          image: cr.yandex/REGISTRY_ID/url-fraud-attack:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.producer"]
          envFrom:
            - configMapRef:
                name: attack-config
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "256Mi" }
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: consumer
          image: cr.yandex/REGISTRY_ID/url-fraud-attack:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.consumer"]
          envFrom:
            - configMapRef:
                name: attack-config
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
