# Credentials for git-sync to clone the (private) DAG repository.
#
# Do NOT commit real tokens. Create with:
#
#   kubectl -n url-fraud create secret generic airflow-git-sync \
#     --from-literal=GIT_SYNC_USERNAME='<gitlab-user>' \
#     --from-literal=GIT_SYNC_PASSWORD='<personal-access-token>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Then set `dags.gitSync.credentialsSecret: airflow-git-sync` in airflow/values.yaml.
#
# Alternative: an SSH deploy key (dags.gitSync.sshKeySecret) holding an `id_rsa`
# you generated and added to the repo's Deploy Keys (read-only).
apiVersion: v1
kind: Secret
metadata:
  name: airflow-git-sync
  namespace: url-fraud
  labels:
    app.kubernetes.io/part-of: url-fraud
type: Opaque
stringData:
  GIT_SYNC_USERNAME: "REPLACE_WITH_GITLAB_USERNAME"
  GIT_SYNC_PASSWORD: "REPLACE_WITH_PERSONAL_ACCESS_TOKEN"
