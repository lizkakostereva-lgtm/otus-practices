# Local-only stack: run the API exactly as the image does, no k8s involved.
# For the Kubernetes path see k8s/ + terraform/ + scripts/.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Match the deployment target (Yandex Cloud nodes are amd64).
    # Override with: PLATFORM=linux/arm64 docker compose up
    platform: ${PLATFORM:-linux/amd64}
    image: url-fraud-api:local
    container_name: url-fraud-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      ENVIRONMENT: local
      ENABLE_METRICS: "true"
      MODEL_PATH: /app/models/model.joblib
      MODEL_METADATA_PATH: /app/models/metadata.json
      # Never use a fallback model in a local run either — fail loudly.
      TRAIN_ON_STARTUP: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped