# Credentials for the in-cluster MLflow stack.
#
# Do NOT commit real values. Create the secret with:
#
#   kubectl -n url-fraud create secret generic mlflow-secrets \
#     --from-literal=POSTGRES_PASSWORD='<db-password>' \
#     --from-literal=AWS_ACCESS_KEY_ID='<s3-key-id>' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='<s3-secret>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The S3 keys are only needed when artifacts are stored in Yandex Object
# Storage; leave the mlflow-s3 secret out to use the in-cluster PVC instead.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: url-fraud
  labels:
    app.kubernetes.io/part-of: url-fraud
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_S3_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_S3_SECRET"
