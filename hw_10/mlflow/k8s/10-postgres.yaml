# PostgreSQL backing store for MLflow (runs, params, metrics, model registry).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-postgres-data
  namespace: url-fraud
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: url-fraud
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-postgres
  namespace: url-fraud
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: url-fraud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-postgres
        app.kubernetes.io/part-of: url-fraud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: mlflow
            - name: POSTGRES_DB
              value: mlflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mlflow", "-d", "mlflow"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "mlflow", "-d", "mlflow"]
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres
  namespace: url-fraud
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: url-fraud
spec:
  selector:
    app.kubernetes.io/name: mlflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
