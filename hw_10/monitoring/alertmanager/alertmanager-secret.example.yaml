# Template for the SMTP credentials consumed by
# monitoring/alertmanager/alertmanager-config.yaml (authPassword -> key `password`).
#
# Do NOT commit real values. Two ways to load it:
#
#   kubectl -n url-fraud create secret generic alertmanager-smtp \
#     --from-literal=password='<smtp-password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # or, if you really want a manifest:
#   kubectl -n url-fraud apply -f alertmanager-secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: url-fraud
  labels:
    app.kubernetes.io/part-of: url-fraud
type: Opaque
stringData:
  password: "REPLACE_WITH_SMTP_PASSWORD"
---
# Template for the optional webhook transport referenced (commented) in the
# AlertmanagerConfig.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-webhook
  namespace: url-fraud
  labels:
    app.kubernetes.io/part-of: url-fraud
type: Opaque
stringData:
  url: "REPLACE_WITH_WEBHOOK_URL"
