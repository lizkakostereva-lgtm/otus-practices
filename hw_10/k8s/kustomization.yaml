# Base manifests for the URL fraud API (hw_10).
#
#   kubectl apply -k k8s/
#   kubectl -n url-fraud set image deployment/url-fraud-api api=cr.yandex/<registry-id>/url-fraud-api:<tag>
#
# The ServiceMonitor needs the Prometheus Operator CRDs; apply it only after
# `make monitoring` (or ignore the error on a cluster without monitoring).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: url-fraud

resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-deployment.yaml
  - 30-service.yaml
  - 50-hpa.yaml
  - 60-pdb.yaml
  - 70-servicemonitor.yaml

# Replaced by scripts/deploy_k8s.sh and by the CI deploy job.
images:
  - name: cr.yandex/REGISTRY_ID/url-fraud-api
    newName: cr.yandex/REGISTRY_ID/url-fraud-api
    newTag: "1.0.0"

commonLabels:
  app.kubernetes.io/part-of: url-fraud
