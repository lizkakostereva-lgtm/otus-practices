global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'churn-api'
    static_configs:
      - targets: ['churn-api.mlops-churn.svc.cluster.local:8000']
    metrics_path: /metrics
