[defaults]
inventory = inventory.ini
host_key_checking = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False
stdout_callback = yaml
deprecation_warnings = False

[ssh_connection]
pipelining = True
# SSH multiplexing is disabled on purpose: a stale ControlMaster through the
# ProxyJump made Ansible hang forever waiting for a become prompt.
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=30 -o ServerAliveCountMax=4
