- name: Deploy PostgreSQL for MLflow
  hosts: postgres
  become: yes
  gather_facts: yes
  vars_files:
    - vars.yml

  tasks:
    - name: Install PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - acl
        state: present
        update_cache: yes

    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Create mlflow role
      become: yes
      become_user: postgres
      shell: |
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_user }}'" | grep -q 1 || psql -c "CREATE ROLE {{ pg_user }} LOGIN PASSWORD '{{ pg_password }}';"

    - name: Create mlflow database
      become: yes
      become_user: postgres
      shell: |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ pg_db }}'" | grep -q 1 || createdb -O {{ pg_user }} {{ pg_db }}

    # The full variant keeps Airflow metadata in the same PostgreSQL VM,
    # in its own role/database.
    - name: Create airflow role
      become: yes
      become_user: postgres
      shell: |
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ airflow_pg_user }}'" | grep -q 1 || psql -c "CREATE ROLE {{ airflow_pg_user }} LOGIN PASSWORD '{{ postgres_password }}';"

    - name: Create airflow database
      become: yes
      become_user: postgres
      shell: |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1 || createdb -O {{ airflow_pg_user }} airflow

    - name: Listen on all interfaces
      become: yes
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"

    - name: Allow connections from subnet
      become: yes
      lineinfile:
        path: /etc/postgresql/14/main/pg_hba.conf
        line: "host all all 10.0.0.0/8 md5"

    - name: Restart PostgreSQL
      systemd:
        name: postgresql
        state: restarted
